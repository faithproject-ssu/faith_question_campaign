<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="믿음이 자격이 되는 순간">
  <meta name="description" content="교육자의 자격은 신앙으로 결정되어야 할까요? 종교적 자격 요건과 채용의 공정성을 질문하는 캠페인.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="믿음이 자격이 되는 순간">
  <meta property="og:description" content="교육자의 자격은 신앙으로 결정되어야 할까요?">
  <title>믿음이 자격이 되는 순간</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="device" id="device">
    <!-- 데스크톱에서만 보이는 기기 장식(다이내믹 아일랜드·상태바) -->
    <div class="island" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span class="sb-time" id="sbTime">9:41</span>
      <span class="sb-icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.4 0 2.6.5 3.5 1.4l1.3-1.3A6.8 6.8 0 0 0 8 4c-1.9 0-3.6.7-4.8 1.9l1.3 1.3c.9-.9 2.1-1.4 3.5-1.4Zm0 3.5c-.6 0-1.2.3-1.6.7L8 11.6l1.6-1.6c-.4-.4-1-.7-1.6-.7Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2"/><path d="M24.5 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" opacity=".45"/></svg>
      </span>
    </div>

    <main class="stage" id="stage"></main>

    <nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
      <button class="tab" type="button" data-tab="home" aria-label="홈">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4.5 12.6 14 4.8l9.5 7.8v10.1a1.8 1.8 0 0 1-1.8 1.8h-4.9v-6.4h-5.6v6.4H6.3a1.8 1.8 0 0 1-1.8-1.8V12.6Z"/></svg>
        <span>홈</span>
      </button>
      <button class="tab" type="button" data-tab="questions" aria-label="질문들">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3.8C7.9 3.8 3.2 7.9 3.2 13c0 2.8 1.4 5.2 3.6 6.9l-.9 4.1 4.4-2.3c1.2.4 2.4.5 3.7.5 6.1 0 10.8-4.1 10.8-9.2S20.1 3.8 14 3.8Z"/><path class="q" d="M11.6 10.7a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.7v.4"/><circle class="dot" cx="14" cy="17.6" r="1.05"/></svg>
        <span>질문들</span>
      </button>
      <button class="tab" type="button" data-tab="archive" aria-label="자료실">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="5" width="20" height="18" rx="3.2"/><path class="q" d="M8.5 10.5h11M8.5 14h11M8.5 17.5h6.5"/></svg>
        <span>자료실</span>
      </button>
    </nav>

    <!-- 기사 이미지 확대 보기 -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
      <div class="viewer-bar">
        <button class="v-btn v-close" type="button" id="viewerClose" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <span class="viewer-title" id="viewerTitle"></span>
        <div class="v-zoom">
          <button class="v-btn" type="button" id="zoomOut" aria-label="축소">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
          <button class="v-btn" type="button" id="zoomIn" aria-label="확대">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
          </button>
        </div>
      </div>
      <div class="viewer-scroll" id="viewerScroll">
        <div class="viewer-canvas" id="viewerCanvas"><img id="viewerImg" alt="" draggable="false"></div>
      </div>
      <p class="viewer-hint" id="viewerHint">두 손가락으로 확대 · 두 번 탭하여 확대/축소</p>
    </div>

    <!-- 홈 화면에 추가 안내 -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="sheet" id="installSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <img class="sheet-icon" src="apple-touch-icon.png" alt="" width="52" height="52">
        <div>
          <h2 class="sheet-title" id="sheetTitle">홈 화면에 추가하기</h2>
          <p class="sheet-sub">앱처럼 아이콘을 눌러 바로 열 수 있어요</p>
        </div>
      </div>
      <ol class="sheet-steps" id="sheetSteps"></ol>
      <div class="sheet-extra" id="sheetExtra"></div>
      <button class="pill solid block" type="button" id="sheetClose">확인</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">이 페이지는 JavaScript가 필요합니다.</p></noscript>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
